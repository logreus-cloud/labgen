[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labgen"
version = "0.1.0"
description = "Отчёты по лабораторным работам из Markdown в DOCX по ГОСТ 7.32-2017"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ilyas Userov" }]
keywords = ["gost", "docx", "markdown", "report", "university", "lab-report"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "python-docx>=1.1",
    "markdown-it-py>=3.0",
    "PyYAML>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/logreus-cloud/labgen"
Issues = "https://github.com/logreus-cloud/labgen/issues"

[project.scripts]
labgen = "labgen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["labgen"]

[tool.hatch.build]
include = ["labgen/assets/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
